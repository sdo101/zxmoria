    DEVICE ZXSPECTRUMNEXT

; load the 16KB core.bin into 8 KB pages 30 and 31...
; ...these are what the loader maps into MMU 4 and MMU 5, so the core runs at $8000
    MMU 4, 30
    MMU 5, 31
    ORG $8000
    INCBIN "core.bin"
    ASSERT $ = $C000, "core.bin must be exactly 16KB, build.ps1 pads it"

; populate 8 KB page 0 in slot 6 ($C000) for the bootloader
    MMU 6, 0
    ORG $C000
BootEntry:
    INCBIN "load.bin"

; load the assets...
; the opening pictures, see tools\make-splash.py, and s_load_splash_48k() in load.bas...
; ...page 10, the normal Spectrum screen, holds the 48K picture, in place, for SAVENEX SCREEN SCR below, so that the nex
; loader shows it while the rest loads; the font, which lives in the first 2KB of page 10 while the game runs, is kept
; in page 76 and the loader copies it into page 10 once the picture has had its turn...
; ...the Next's picture (80KB) goes in pages 66 to 75, all of 66 to 76 is the dungeon
; map's, which is only filled once the game is running, after the loader has finished with them
    SLOT 4 : PAGE 10 : ORG $8000 : INCBIN "splash/splash.scr"
    SLOT 4 : PAGE 76 : ORG $8000 : INCBIN "font.bin"
             PAGE 66 : ORG $8000 : INCBIN "splash/splash-l2.bin", 0, 8192
             PAGE 67 : ORG $8000 : INCBIN "splash/splash-l2.bin", 8192, 8192
             PAGE 68 : ORG $8000 : INCBIN "splash/splash-l2.bin", 16384, 8192
             PAGE 69 : ORG $8000 : INCBIN "splash/splash-l2.bin", 24576, 8192
             PAGE 70 : ORG $8000 : INCBIN "splash/splash-l2.bin", 32768, 8192
             PAGE 71 : ORG $8000 : INCBIN "splash/splash-l2.bin", 40960, 8192
             PAGE 72 : ORG $8000 : INCBIN "splash/splash-l2.bin", 49152, 8192
             PAGE 73 : ORG $8000 : INCBIN "splash/splash-l2.bin", 57344, 8192
             PAGE 74 : ORG $8000 : INCBIN "splash/splash-l2.bin", 65536, 8192
             PAGE 75 : ORG $8000 : INCBIN "splash/splash-l2.bin", 73728, 8192
    SLOT 4 : PAGE 97 : ORG $8000 : INCBIN "stage-player.bin"
