; whole screens of text, the opening screen and the credits, always exactly 2 pages
             PAGE 64 : ORG $8000 : INCBIN "data/screens.bin", 0, 8192
             PAGE 65 : ORG $8000 : INCBIN "data/screens.bin", 8192
; the two rogue like help texts, one page, the last there is, N.B: the four before it, 219 to 222, held the licence
; until 13-Oct-2026 and are free, the game no longer shows it, it is the file LICENSE, zxmoria.lic on the SD card...
; ...it is up here out of the way of the code pages, which grow upwards from 96
             PAGE 223 : ORG $8000 : INCBIN "data/helptext.bin"
; the strings database: its index, and its text, always exactly 6 pages, 57 to 62, as many of them empty as are not needed yet (page 56 is set aside for a second page of index)
             PAGE 55 : ORG $8000 : INCBIN "data/stringsindex.bin"
             PAGE 57 : ORG $8000 : INCBIN "data/stringstext.bin", 0, 8192
             PAGE 58 : ORG $8000 : INCBIN "data/stringstext.bin", 8192, 8192
             PAGE 59 : ORG $8000 : INCBIN "data/stringstext.bin", 16384, 8192
             PAGE 60 : ORG $8000 : INCBIN "data/stringstext.bin", 24576, 8192
             PAGE 61 : ORG $8000 : INCBIN "data/stringstext.bin", 32768, 8192
             PAGE 62 : ORG $8000 : INCBIN "data/stringstext.bin", 40960

; small tables that never change: store owners, what the stores stock, race prices
             PAGE 54 : ORG $8000 : INCBIN "data/gametables.bin"

; everything for making a new character: races, classes and backgrounds, exactly one page
             PAGE 95 : ORG $8000 : INCBIN "data/character.bin"

; two small tables that live in the core data page (32), at A_NORMAL_TABLE in constants.bas, 4608 bytes into it
             PAGE 32 : ORG $8000 + 4608 : INCBIN "data/tables.bin"
; how many creatures there are of each level, also in the core data page, at A_TABLE_MONSTER_LEVELS, 4480 bytes into it
             PAGE 32 : ORG $8000 + 4480 : INCBIN "data/creaturelevels.bin"

; the game's databases, made by create-data.ps1, 64 byte records, 128 of them (8192 bytes) to a page...
; ...INCBIN <file>, <offset>, <length> takes one page's worth at a time, the last line of each takes whatever is left
; creatures: 279 records, pages 47 to 49
    SLOT 4 : PAGE 47 : ORG $8000 : INCBIN "data/creatures.bin", 0, 8192
             PAGE 48 : ORG $8000 : INCBIN "data/creatures.bin", 8192, 8192
             PAGE 49 : ORG $8000 : INCBIN "data/creatures.bin", 16384

; objects: 420 records, pages 50 to 53
             PAGE 50 : ORG $8000 : INCBIN "data/objects.bin", 0, 8192
             PAGE 51 : ORG $8000 : INCBIN "data/objects.bin", 8192, 8192
             PAGE 52 : ORG $8000 : INCBIN "data/objects.bin", 16384, 8192
             PAGE 53 : ORG $8000 : INCBIN "data/objects.bin", 24576
; which objects are found at which depth, in the same page, after the last object
             PAGE 53 : ORG $9000 : INCBIN "data/objectlevels.bin"
; what the spells and prayers cost each class, and their names, in the same page again
             PAGE 53 : ORG $9400 : INCBIN "data/spells.bin"

; save the nex file using the CLI defined NEX_FILE
; p1: filename
; p2: start address (BootEntry = $C000)
; p3: stack address (BootEntry + 8KB - 2 = $dffe)
; p4: entry bank    (bank 0 contains page 0)
; p5: file version  (2 = v1.2)
    SAVENEX OPEN NEX_FILE, BootEntry, BootEntry + $2000 - 2, 0, 2
    SAVENEX CORE 3, 1, 5 

; cfg <border>, <filehandle>, <preservenextregs>, <2RM_RAM_req>
; border: 2 (red), filehandle: 0, preserve: 1, 2MB: 1
    SAVENEX CFG 2, 0, 1, 1

; the 48K picture in page 10 as the loading screen, which the nex loader shows while it loads the rest
    SAVENEX SCREEN SCR

; include all loaded banks in numerical sequence...
    ;SAVENEX BANK 2, 0, 25, 28, 30, 34
    SAVENEX AUTO
    SAVENEX CLOSE